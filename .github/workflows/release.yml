name: Build, Test & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore SweetMeSoft.Library.sln

      - name: Build Release Solution
        run: dotnet build SweetMeSoft.Library.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test SweetMeSoft.Library.sln --configuration Release --no-build --verbosity normal

      - name: Pack NuGet Packages
        run: dotnet pack SweetMeSoft.Library.sln --configuration Release --no-build --output ./nupkgs

      - name: Publish to NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
